<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f1f1f"><title>收藏 · Karounds 拓展</title><meta name="description" content="浏览 Karounds 拓展卡牌，按花费、类型和稀有度筛选。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="official-ui.css"><link rel="stylesheet" href="card-detail.css"><link rel="stylesheet" href="intelligence.css"><link rel="stylesheet" href="intelligence-layout.css"><link rel="stylesheet" href="official-alignment.css"><link rel="stylesheet" href="scroll-reveal.css"><link rel="stylesheet" href="responsive-ui.css"><link rel="stylesheet" href="monitor.css"><script src="data.js" defer></script><script src="ui/icons.js" defer></script><script src="ui/nations.js" defer></script><script src="monitor-renderer.js" defer></script><script src="monitor.js" defer></script><script src="app.js" defer></script><script src="scroll-reveal.js" defer></script></head>
<body>
<header class="header"><a href="#collection" class="brand" aria-label="Karounds 拓展收藏首页"><b><img src="ui/kards-logo.svg" alt="KARDS"></b></a><nav aria-label="主导航"><a href="#collection" class="active" id="collectionNav">收藏</a><a href="#intelligence" id="intelligenceNav">情报</a><a href="#monitoring" id="monitoringNav">监察</a></nav><div class="header-right"><span class="expansion-label">Karounds 拓展</span><a class="official" href="https://www.kards.com/zh/decks/collection" target="_blank" rel="noopener"><span>官方网站</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="2"/></svg></a></div></header>
<main id="collection">
<section class="collection-hero Hero_hero__njbMM">
<div class="Hero_hero__image__M84id"><img class="Hero_hero__img__cBkxX" src="ui/collection-hero.jpg" width="1920" height="610" alt="" decoding="async"></div>
<div class="Hero_hero__container__qcbpG"><div class="Hero_hero__content__XPEV9"><div class="Hero_hero__text__L7wZo"><h1 class="Hero_hero__title__Np1AF">收藏</h1><p class="Hero_hero__tagline__n8GKk">卡牌</p></div></div></div>
<span class="collection-total" hidden><strong id="total">125</strong></span></section>
<section class="DecksWrap_decks__NDypD"><div class="workspace DecksWrap_decks__container__Y1uyR" aria-label="卡牌浏览器">
<button class="mobile-filter-button outline-button" id="openFilters" aria-haspopup="dialog" aria-controls="filterDialog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M3 6h18M6 12h12M9 18h6" stroke="currentColor" stroke-width="2"/></svg><span>筛选卡牌</span><span id="filterCount"></span></button>
<div id="filterHome"><div class="filter-panel" id="filterPanel"><div class="filter-layout">
<div class="filter-row filter-nation"><span class="filter-label">国家</span><div class="pills" id="nationFilters" role="group" aria-label="国家筛选"></div></div><div class="filter-row filter-cost"><span class="filter-label">花费</span><div class="pills" id="costFilters" role="group" aria-label="花费筛选"></div></div>
<div class="filter-row filter-type"><span class="filter-label">类型</span><div class="pills" id="typeFilters" role="group" aria-label="类型筛选"></div></div>
<div class="filter-row filter-rarity"><span class="filter-label">稀有度</span><div class="pills" id="rarityFilters" role="group" aria-label="稀有度筛选"></div></div>
<div class="filter-row filter-expansion"><span class="filter-label" id="expansionLabel">拓展包</span>
<details class="expansion-picker" id="expansionPicker">
<summary id="expansionToggle" aria-labelledby="expansionLabel expansionSelection"><img class="expansion-icon" id="expansionSelectedIcon" src="ui/expansions/All.svg" width="26" height="26" alt=""><span id="expansionSelection" class="sr-only">全部拓展包</span></summary>
<div class="expansion-options" id="expansionFilters" role="group" aria-labelledby="expansionLabel"></div>
</details></div>
<div class="filter-row filter-search"><label class="filter-label" for="search">搜索</label><label class="search"><input id="search" type="search" placeholder="搜索卡牌" autocomplete="off" aria-label="搜索卡牌名称"><span class="search-icon" aria-hidden="true"></span></label></div>

<div class="filter-row filter-role"><span class="filter-label">脱手性</span><div class="pills" id="roleFilters" role="group" aria-label="脱手性筛选"></div></div>
<div class="filter-row filter-other" role="group" aria-labelledby="otherFiltersLabel">
  <span class="filter-label" id="otherFiltersLabel">其他</span>
  <label class="spawnables-option"><input id="spawnables" type="checkbox"><span id="spawnablesLabel">包括可能出现的卡牌</span></label>
</div>
</div><button class="mobile-filter-apply outline-button" id="applyFilters"><span>查看 <b id="mobileResultCount">125</b> 张卡牌</span></button></div></div>
<div class="results-bar"><p aria-live="polite">找到 <strong id="resultCount">125</strong> 张卡牌<span id="allCount" hidden>125</span><span id="filteredHint" hidden></span></p><div class="active-filter-wrap"><div id="activeFilters" aria-label="已选筛选条件"></div><button id="reset" class="outline-button small-button"><span>清除筛选</span></button></div><label class="sort-label"><span class="sr-only">排序</span><select id="sort" aria-label="卡牌排序"><option value="cost-asc">花费从低到高</option><option value="cost-desc">花费从高到低</option><option value="rarity">稀有度</option><option value="name">名称</option></select></label></div>
<div class="grid" id="grid"></div><div class="empty" id="empty" hidden><h2>没有找到卡牌</h2><button id="emptyReset" class="outline-button"><span>清除全部筛选</span></button></div>
</div></section>

</main>

<main id="monitoring" class="monitor-page" hidden aria-labelledby="monitorTitle">
<header class="monitor-heading"><h1 id="monitorTitle" tabindex="-1">监察</h1><p class="scope">中国可用卡牌</p></header>
<div class="monitor-filters"><label>拓展包 <select data-monitor="expansion" disabled><option>读取中枢中</option></select></label><button data-monitor="refresh" type="button">重新统计</button><span data-monitor="status" role="status"></span></div>
<p data-monitor="error" role="alert" hidden></p><div data-monitor="summary" class="summary"></div><p data-monitor="coverage" class="coverage"></p><div data-monitor="charts" class="charts"></div>
<section class="cards-section" aria-labelledby="monitorCardsTitle"><div class="section-title"><h2 id="monitorCardsTitle" data-monitor="cards-title">卡牌明细</h2><button data-monitor="clear-chart" type="button" hidden>查看全部</button></div><div class="table-scroll"><table><thead><tr><th>UID</th><th>卡名</th><th>国家</th><th>范围</th><th>类型</th><th>稀有度</th><th>花费</th><th>脱手性</th><th>状态</th></tr></thead><tbody data-monitor="cards"></tbody></table></div></section>
</main>
<main id="intelligence" class="intelligence-page" hidden aria-labelledby="intelligenceTitle">
<section class="intel-intro Hero_hero__njbMM">
  <div class="Hero_hero__image__M84id"><img class="Hero_hero__img__cBkxX" src="ui/intelligence-hero.jpg" width="1920" height="610" alt="" decoding="async"></div>
  <div class="Hero_hero__container__qcbpG"><div class="Hero_hero__content__XPEV9"><div class="Hero_hero__text__L7wZo">
    <h1 class="Hero_hero__title__Np1AF" id="intelligenceTitle" tabindex="-1">情报</h1>
    <p class="Hero_hero__tagline__n8GKk">特色内容</p>
  </div></div></div>
</section>
<div id="intelligenceSections"></div>
</main>
<footer class="site-footer"><div class="site-footer-inner"><a href="#collection" class="footer-logo"><img src="ui/kards-logo.svg" alt="KARDS" width="100" height="46"></a><div><b>Karounds 拓展</b><p>卡牌收藏</p></div><span>非官方卡牌浏览工具</span></div></footer>
<dialog id="filterDialog" aria-labelledby="filterDialogTitle"><button class="close" id="closeFilters" aria-label="关闭筛选">×</button><h2 id="filterDialogTitle">筛选卡牌</h2><div id="filterDialogBody"></div></dialog>
<dialog id="detail" aria-labelledby="detailName"><button class="close" id="closeDetail" aria-label="关闭详情">×</button><div class="detail-layout"><div id="detailImage" class="detail-image"></div><div class="detail-copy"><p class="eyebrow" id="detailNation"></p><h2 id="detailName"></h2><div class="detail-sub" id="detailSub"></div><ul id="detailFields"></ul><div class="detail-nav"><button id="detailBack" hidden></button><button id="previous">← 上一张</button><span id="detailPosition"></span><button id="next">下一张 →</button></div></div></div></dialog>

<div class="toast" id="toast" role="status" hidden></div>
</body></html>
